<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tennis Planer">
<meta name="theme-color" content="#0a0f0a">
<title>Tennis Doppel Planer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  --bg:#0a0f0a;
  --s1:#111811;
  --s2:#192019;
  --s3:#1f281f;
  --border:#2a3a2a;
  --accent:#7ec850;
  --accent2:#b4e882;
  --court-a:#f4a94a;
  --court-b:#4ab8f4;
  --court-c:#e05c7a;
  --text:#e8f0e0;
  --muted:#6a7e5a;
  --r:14px;
  --nav-h:64px;
  --top-h:56px;
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
}

body{
  background-image:
    radial-gradient(ellipse 60% 30% at 80% 10%, rgba(126,200,80,.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 20% at 20% 90%, rgba(74,184,244,.05) 0%, transparent 50%);
}

/* ── TOPBAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;
  top:env(safe-area-inset-top,0);
  height:var(--top-h);
  background:rgba(10,15,10,.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;
  z-index:100;
  gap:12px;
}
.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.6rem;letter-spacing:2px;
  color:var(--accent);line-height:1;
}
.logo span{color:var(--text);opacity:.5;}
.step-indicator{
  margin-left:auto;
  display:flex;gap:6px;align-items:center;
}
.step-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--border);
  transition:all .3s ease;
}
.step-dot.active{background:var(--accent);width:18px;border-radius:3px;}
.step-dot.done{background:var(--muted);}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  padding-bottom:env(safe-area-inset-bottom,0);
  background:rgba(10,15,10,.95);
  border-top:1px solid var(--border);
  display:flex;z-index:100;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;padding:10px 0 8px;
  border:none;background:transparent;
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-size:.62rem;font-weight:500;cursor:pointer;
}
.nav-item.active{color:var(--accent);}
.nav-icon{font-size:1.25rem;line-height:1;}

/* ── PAGES ── */
.page{
  display:none;
  min-height:100vh;
  padding-top:calc(var(--top-h) + env(safe-area-inset-top,0px) + 14px);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 20px);
  padding-left:16px;padding-right:16px;
}
.page.active{display:block;}

/* ── CARDS ── */
.card{
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px;margin-bottom:12px;
}
.card-label{
  font-size:.62rem;font-weight:600;
  text-transform:uppercase;letter-spacing:1.5px;
  color:var(--muted);margin-bottom:12px;
}

/* ── INPUTS ── */
input[type=text],input[type=number]{
  background:var(--s2);
  border:1.5px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:16px;
  padding:12px 14px;
  width:100%;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
  transition:border-color .2s;
}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent);}
input::placeholder{color:var(--muted);}
input[type=number]{width:90px;}

/* ── BUTTONS ── */
.btn-primary{
  background:var(--accent);
  border:none;border-radius:14px;
  color:#0a0f0a;
  font-family:'DM Sans',sans-serif;
  font-size:1rem;font-weight:600;
  padding:16px;width:100%;margin-top:6px;
  cursor:pointer;transition:opacity .15s,transform .1s;
  -webkit-user-select:none;
}
.btn-primary:active{opacity:.8;transform:scale(.98);}
.btn-primary:disabled{opacity:.3;cursor:not-allowed;}

.btn-ghost{
  background:transparent;
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--muted);
  font-family:'DM Sans',sans-serif;
  font-size:.9rem;
  padding:13px;width:100%;margin-top:8px;
  cursor:pointer;
  -webkit-user-select:none;
  transition:border-color .2s,color .2s;
}
.btn-ghost:hover{border-color:var(--muted);color:var(--text);}

.btn-danger{
  background:transparent;
  border:1px solid rgba(224,92,122,.3);
  border-radius:12px;
  color:#e05c7a;
  font-family:'DM Sans',sans-serif;
  font-size:.9rem;
  padding:13px;width:100%;margin-top:8px;
  cursor:pointer;
}

/* ── ADD ROW ── */
.add-row{display:flex;gap:8px;margin-bottom:10px;}
.add-row input{flex:1;}
.add-btn{
  background:var(--accent);
  border:none;border-radius:10px;
  color:#0a0f0a;
  font-size:1.4rem;
  width:48px;height:48px;flex-shrink:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;
  transition:opacity .15s;
}
.add-btn:active{opacity:.7;}

/* ── PLAYER LIST ── */
.player-list{display:flex;flex-direction:column;gap:6px;}
.player-item{
  display:flex;align-items:center;gap:10px;
  background:var(--s2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 12px;
  animation:slideIn .2s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.player-avatar{
  width:32px;height:32px;border-radius:50%;
  background:rgba(126,200,80,.15);
  border:1px solid rgba(126,200,80,.3);
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:600;flex-shrink:0;
}
.player-name{flex:1;font-size:.92rem;}
.del-btn{
  background:none;border:none;
  color:var(--muted);cursor:pointer;
  font-size:1.1rem;padding:4px;
  line-height:1;transition:color .15s;
  -webkit-user-select:none;
}
.del-btn:hover{color:#e05c7a;}

.empty-hint{
  text-align:center;
  color:var(--muted);
  font-size:.85rem;
  padding:16px 0;
}

/* ── COUNT BADGE ── */
.count-badge{
  display:inline-block;
  background:rgba(126,200,80,.12);
  color:var(--accent);
  border:1px solid rgba(126,200,80,.25);
  border-radius:99px;
  font-size:.65rem;font-weight:600;
  padding:2px 9px;margin-left:8px;
}

/* ── ROUNDS INPUT ── */
.rounds-row{
  display:flex;align-items:center;gap:14px;
  margin-top:4px;
}
.rounds-label{font-size:.95rem;color:var(--text);}

/* ── PLAYERS SUMMARY ── */
.pill{
  display:inline-block;
  background:var(--s2);
  border:1px solid var(--border);
  border-radius:99px;
  font-size:.7rem;
  padding:3px 10px;
  margin:2px;
  color:var(--text);
}

/* ── WARNING ── */
.warn-box{
  background:rgba(244,169,74,.07);
  border:1px solid rgba(244,169,74,.25);
  border-radius:10px;
  padding:10px 14px;
  font-size:.78rem;
  color:var(--court-a);
  margin-bottom:10px;
}

/* ── SCHEDULE ── */
.round-card{
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:14px;margin-bottom:12px;
  animation:fadeUp .25s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.round-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem;letter-spacing:2px;
  color:var(--accent);margin-bottom:10px;
}

.match{
  display:flex;align-items:center;gap:8px;
  padding:9px 0;
  border-bottom:1px solid var(--border);
}
.match:last-child{border-bottom:none;}

.court-badge{
  font-size:.65rem;font-weight:600;
  border-radius:6px;
  padding:3px 7px;
  min-width:36px;text-align:center;
  flex-shrink:0;letter-spacing:.5px;
}
.court-A{background:rgba(244,169,74,.12);color:var(--court-a);border:1px solid rgba(244,169,74,.3);}
.court-B{background:rgba(74,184,244,.12);color:var(--court-b);border:1px solid rgba(74,184,244,.3);}
.court-C{background:rgba(224,92,122,.12);color:var(--court-c);border:1px solid rgba(224,92,122,.3);}

.team{flex:1;font-size:.82rem;min-width:0;line-height:1.3;}
.team strong{display:block;font-weight:500;}
.team span{font-size:.7rem;color:var(--muted);}
.vs-badge{
  font-size:.6rem;font-weight:600;
  background:var(--s3);
  color:var(--muted);
  border-radius:4px;
  padding:2px 5px;flex-shrink:0;
}

.rest-row{
  font-size:.75rem;color:var(--muted);
  margin-top:10px;padding-top:10px;
  border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;align-items:center;gap:4px;
}
.rest-label{margin-right:4px;}

/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-box{
  background:var(--s1);border:1px solid var(--border);
  border-radius:12px;padding:14px;text-align:center;
}
.stat-n{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;line-height:1;
  color:var(--accent);
}
.stat-l{font-size:.65rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.8px;}

/* ── INSTALL BANNER ── */
.install-banner{
  background:rgba(126,200,80,.07);
  border:1px solid rgba(126,200,80,.2);
  border-radius:12px;padding:12px 14px;
  font-size:.76rem;color:var(--accent2);
  margin-bottom:14px;
}
.install-banner strong{display:block;font-size:.8rem;margin-bottom:3px;}

/* ── HISTORY ── */
.hist-table{width:100%;border-collapse:collapse;font-size:.78rem;}
.hist-table th{color:var(--muted);font-weight:500;text-align:left;padding:5px 3px;border-bottom:1px solid var(--border);}
.hist-table td{padding:7px 3px;border-bottom:1px solid rgba(42,58,42,.5);}
.hist-table tr:last-child td{border:none;}

/* ── DESKTOP TWEAKS ── */
@media (min-width:600px){
  .page{max-width:480px;margin:0 auto;}
  .topbar{justify-content:center;}
  .topbar .logo{margin-right:auto;}
  .bottom-nav{max-width:480px;left:50%;transform:translateX(-50%);}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">Tennis<span>.</span>Planer</div>
  <div class="step-indicator">
    <div class="step-dot active" id="dot-1"></div>
    <div class="step-dot" id="dot-2"></div>
    <div class="step-dot" id="dot-3"></div>
  </div>
</div>

<!-- PAGE 1: SPIELERLISTE -->
<div class="page active" id="page-players">

  <div class="install-banner" id="install-banner" style="display:none">
    <strong>💡 Als App installieren</strong>
    Safari → Teilen → <strong>„Zum Home-Bildschirm"</strong>
  </div>

  <div class="card">
    <div class="card-label">
      Spielerliste
      <span class="count-badge" id="player-count">0</span>
    </div>
    <div class="add-row">
      <input type="text" id="new-player-input"
        placeholder="Name eingeben …"
        autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"
        onkeydown="if(event.key==='Enter'){event.preventDefault();addPlayer();}">
      <button class="add-btn" onclick="addPlayer()" aria-label="Hinzufügen">+</button>
    </div>
    <div class="player-list" id="player-list">
      <div class="empty-hint" id="empty-hint">Noch keine Spieler erfasst</div>
    </div>
  </div>

  <div class="warn-box" id="warn-min" style="display:none">
    ⚠ Mindestens 4 Spieler erforderlich
  </div>

  <button class="btn-primary" onclick="goRounds()">Weiter → Runden festlegen</button>
</div>

<!-- PAGE 2: RUNDEN -->
<div class="page" id="page-rounds">
  <div class="card">
    <div class="card-label">Anzahl Runden</div>
    <div class="rounds-row">
      <input type="number" id="num-rounds" min="1" max="30" value="4"
        autocomplete="off">
      <span class="rounds-label">Runden spielen</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Spieler <span class="count-badge" id="player-count-2">0</span></div>
    <div id="players-summary" style="margin-top:2px"></div>
  </div>

  <button class="btn-primary" onclick="goSchedule()">Spielplan erstellen →</button>
  <button class="btn-ghost" onclick="goPage('page-players',1)">← Spieler bearbeiten</button>
</div>

<!-- PAGE 3: SPIELPLAN -->
<div class="page" id="page-schedule">
  <div id="schedule-output"></div>
  <button class="btn-primary" onclick="goPage('page-rounds',2)">Nochmal planen →</button>
  <button class="btn-ghost" onclick="goPage('page-players',1)">← Spieler bearbeiten</button>
</div>

<!-- PAGE 4: STATISTIK -->
<div class="page" id="page-stats">
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-n" id="st-sessions">0</div><div class="stat-l">Planungen</div></div>
    <div class="stat-box"><div class="stat-n" id="st-games">0</div><div class="stat-l">Spiele total</div></div>
    <div class="stat-box"><div class="stat-n" id="st-players">0</div><div class="stat-l">Spieler max.</div></div>
    <div class="stat-box"><div class="stat-n" id="st-rounds">0</div><div class="stat-l">Runden max.</div></div>
  </div>
  <div class="card">
    <div class="card-label">📋 Verlauf</div>
    <div id="hist-content"><span style="color:var(--muted);font-size:.85rem">Noch keine Planungen.</span></div>
  </div>
  <button class="btn-danger" onclick="resetStats()">🗑 Statistik zurücksetzen</button>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item active" id="nav-planer" onclick="switchTab('planer')">
    <span class="nav-icon">🎾</span>Planer
  </button>
  <button class="nav-item" id="nav-stats" onclick="switchTab('stats')">
    <span class="nav-icon">📊</span>Statistik
  </button>
</div>

<script>
// ── STATE ──────────────────────────────────────────────
let players = [];
let currentPlanerPage = 'page-players';

// ── STATS ──────────────────────────────────────────────
function initStats(){return{sessions:0,totalGames:0,maxPlayers:0,maxRounds:0,history:[]};}
function loadStats(){try{return JSON.parse(localStorage.getItem('tdp_stats'))||initStats();}catch{return initStats();}}
function saveStats(){try{localStorage.setItem('tdp_stats',JSON.stringify(stats));}catch{}}
let stats = loadStats();

// ── HELPERS ────────────────────────────────────────────
function initials(name){
  const p=name.trim().split(' ');
  if(p.length>=2)return(p[0][0]+p[p.length-1][0]).toUpperCase();
  return name.slice(0,2).toUpperCase();
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── PLAYER MANAGEMENT ──────────────────────────────────
function renderPlayers(){
  const list=document.getElementById('player-list');
  const badge=document.getElementById('player-count');
  badge.textContent=players.length;
  if(!players.length){
    list.innerHTML='<div class="empty-hint">Noch keine Spieler erfasst</div>';
    return;
  }
  list.innerHTML=players.map((p,i)=>`
    <div class="player-item">
      <div class="player-avatar">${initials(p)}</div>
      <span class="player-name">${p}</span>
      <button class="del-btn" onclick="removePlayer(${i})" aria-label="Entfernen">✕</button>
    </div>`).join('');
}

function addPlayer(){
  const inp=document.getElementById('new-player-input');
  const name=inp.value.trim();
  if(!name)return;
  if(players.map(p=>p.toLowerCase()).includes(name.toLowerCase())){
    inp.select();return;
  }
  players.push(name);
  inp.value='';
  document.getElementById('warn-min').style.display='none';
  renderPlayers();
  inp.focus();
}

function removePlayer(i){
  players.splice(i,1);
  renderPlayers();
}

// ── NAVIGATION ────────────────────────────────────────
function goPage(pageId, dotNum){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  currentPlanerPage=pageId;
  window.scrollTo(0,0);
  // dots
  [1,2,3].forEach(n=>{
    const d=document.getElementById('dot-'+n);
    d.classList.remove('active','done');
    if(n===dotNum)d.classList.add('active');
    else if(n<dotNum)d.classList.add('done');
  });
}

function switchTab(tab){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+tab).classList.add('active');
  if(tab==='stats'){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-stats').classList.add('active');
    renderStats();
    window.scrollTo(0,0);
  } else {
    goPage(currentPlanerPage, currentPlanerPage==='page-players'?1:currentPlanerPage==='page-rounds'?2:3);
  }
}

function goRounds(){
  if(players.length<4){document.getElementById('warn-min').style.display='block';return;}
  document.getElementById('warn-min').style.display='none';
  document.getElementById('player-count-2').textContent=players.length;
  const sum=document.getElementById('players-summary');
  sum.innerHTML=players.map(p=>`<span class="pill">${p}</span>`).join('');
  goPage('page-rounds',2);
}

// ── SCHEDULE GENERATION ───────────────────────────────
function goSchedule(){
  const numR=Math.max(1,parseInt(document.getElementById('num-rounds').value)||4);
  const courts=['A','B','C'];
  const maxMatches=courts.length;

  const partnerCount={},opponentCount={};
  players.forEach(a=>{
    partnerCount[a]={};opponentCount[a]={};
    players.forEach(b=>{if(a!==b){partnerCount[a][b]=0;opponentCount[a][b]=0;}});
  });

  const rounds=[];
  for(let r=0;r<numR;r++){
    const playCount={};
    players.forEach(n=>playCount[n]=rounds.reduce((s,rd)=>s+(rd.playing.includes(n)?1:0),0));
    const pool=shuffle(players).sort((a,b)=>playCount[a]-playCount[b]);
    const available=pool.slice(0,Math.min(maxMatches*4,pool.length));
    const used=new Set();
    const matches=[];
    const avail=shuffle(available);

    function bestPartner(p,candidates){
      let best=null,bestScore=Infinity;
      candidates.forEach(c=>{
        if(c===p||used.has(c))return;
        const s=(partnerCount[p][c]||0)*3+(opponentCount[p][c]||0);
        if(s<bestScore){bestScore=s;best=c;}
      });
      return best;
    }

    for(let i=0;i<avail.length&&matches.length<maxMatches;i++){
      const p1=avail[i];if(used.has(p1))continue;
      const p2=bestPartner(p1,avail);if(!p2)continue;
      used.add(p1);used.add(p2);
      const rem=avail.filter(x=>!used.has(x));
      if(rem.length<2){used.delete(p1);used.delete(p2);continue;}
      let bestP3=null,bestP4=null,bestOpp=Infinity;
      for(let j=0;j<rem.length;j++){
        for(let k=j+1;k<rem.length;k++){
          const p3=rem[j],p4=rem[k];
          const s=(partnerCount[p3][p4]||0)*3+
            (opponentCount[p1][p3]||0)+(opponentCount[p1][p4]||0)+
            (opponentCount[p2][p3]||0)+(opponentCount[p2][p4]||0);
          if(s<bestOpp){bestOpp=s;bestP3=p3;bestP4=p4;}
        }
      }
      if(!bestP3){used.delete(p1);used.delete(p2);continue;}
      used.add(bestP3);used.add(bestP4);
      [p1,p2].forEach(a=>[p1,p2].forEach(b=>{if(a!==b)partnerCount[a][b]++;}));
      [bestP3,bestP4].forEach(a=>[bestP3,bestP4].forEach(b=>{if(a!==b)partnerCount[a][b]++;}));
      [[p1,p2],[bestP3,bestP4]].forEach(t1=>t1.forEach(a=>{
        [[p1,p2],[bestP3,bestP4]].forEach(t2=>{if(t1!==t2)t2.forEach(b=>{opponentCount[a][b]++;});});
      }));
      matches.push({court:courts[matches.length],t1:[p1,p2],t2:[bestP3,bestP4]});
    }

    // fill remaining courts
    const rem2=avail.filter(x=>!used.has(x));
    let idx=0;
    while(matches.length<maxMatches&&rem2.length-idx>=4){
      const p1=rem2[idx],p2=rem2[idx+1],p3=rem2[idx+2],p4=rem2[idx+3];idx+=4;
      [p1,p2].forEach(a=>[p1,p2].forEach(b=>{if(a!==b)partnerCount[a][b]++;}));
      [p3,p4].forEach(a=>[p3,p4].forEach(b=>{if(a!==b)partnerCount[a][b]++;}));
      [[p1,p2],[p3,p4]].forEach(t1=>t1.forEach(a=>{
        [[p1,p2],[p3,p4]].forEach(t2=>{if(t1!==t2)t2.forEach(b=>{opponentCount[a][b]++;});});
      }));
      matches.push({court:courts[matches.length],t1:[p1,p2],t2:[p3,p4]});
    }

    const playing=[...new Set(matches.flatMap(m=>[...m.t1,...m.t2]))];
    const resting=players.filter(n=>!playing.includes(n));
    rounds.push({matches,playing,resting});
  }

  // Render
  const out=document.getElementById('schedule-output');
  out.innerHTML='';
  const totalGames=rounds.reduce((s,r)=>s+r.matches.length,0);

  rounds.forEach((rd,ri)=>{
    const div=document.createElement('div');div.className='round-card';
    let html=`<div class="round-title">Runde ${ri+1}</div>`;
    rd.matches.forEach(m=>{
      html+=`<div class="match">
        <span class="court-badge court-${m.court}">Platz ${m.court}</span>
        <span class="team"><strong>${m.t1[0]}</strong><span>& ${m.t1[1]}</span></span>
        <span class="vs-badge">VS</span>
        <span class="team"><strong>${m.t2[0]}</strong><span>& ${m.t2[1]}</span></span>
      </div>`;
    });
    if(rd.resting.length){
      html+=`<div class="rest-row"><span class="rest-label">Pause:</span>${rd.resting.map(n=>`<span class="pill">${n}</span>`).join('')}</div>`;
    }
    div.innerHTML=html;
    out.appendChild(div);
  });

  // Summary card
  const sum=document.createElement('div');sum.className='card';
  sum.innerHTML=`<div class="card-label">Übersicht</div>
    <div class="stat-grid" style="margin-bottom:0">
      <div class="stat-box"><div class="stat-n">${players.length}</div><div class="stat-l">Spieler</div></div>
      <div class="stat-box"><div class="stat-n">${numR}</div><div class="stat-l">Runden</div></div>
      <div class="stat-box"><div class="stat-n">${totalGames}</div><div class="stat-l">Spiele total</div></div>
      <div class="stat-box"><div class="stat-n" style="font-size:1.4rem;letter-spacing:3px">A B C</div><div class="stat-l">Plätze</div></div>
    </div>`;
  out.appendChild(sum);

  // Save stats
  stats.sessions++;
  stats.totalGames+=totalGames;
  stats.maxPlayers=Math.max(stats.maxPlayers,players.length);
  stats.maxRounds=Math.max(stats.maxRounds,numR);
  stats.history.unshift({
    date:new Date().toLocaleDateString('de-CH'),
    players:players.length,
    rounds:numR,
    games:totalGames
  });
  if(stats.history.length>50)stats.history=stats.history.slice(0,50);
  saveStats();

  goPage('page-schedule',3);
}

// ── STATS ────────────────────────────────────────────
function renderStats(){
  document.getElementById('st-sessions').textContent=stats.sessions;
  document.getElementById('st-games').textContent=stats.totalGames;
  document.getElementById('st-players').textContent=stats.maxPlayers||'—';
  document.getElementById('st-rounds').textContent=stats.maxRounds||'—';

  const hist=document.getElementById('hist-content');
  if(!stats.history.length){
    hist.innerHTML='<span style="color:var(--muted);font-size:.85rem">Noch keine Planungen.</span>';
    return;
  }
  hist.innerHTML=`<table class="hist-table">
    <thead><tr><th>Datum</th><th>Spieler</th><th>Runden</th><th>Spiele</th></tr></thead>
    <tbody>${stats.history.slice(0,30).map(h=>`
      <tr>
        <td style="color:var(--muted)">${h.date}</td>
        <td>${h.players}</td>
        <td>${h.rounds}</td>
        <td style="color:var(--accent);font-weight:500">${h.games}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function resetStats(){
  if(confirm('Statistik wirklich zurücksetzen?')){
    stats=initStats();saveStats();renderStats();
  }
}

if(isIOS&&!window.navigator.standalone){
  document.getElementById('install-banner').style.display='block';
}
renderPlayers();
